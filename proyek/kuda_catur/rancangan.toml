          [17.4, 6.8], [18.0, 9.0], [18.0, 11.2], [17.2, 13.6], [15.4, 16.0], [13.6, 18.0], [12.9, 19.4],
          [13.6, 20.6], [13.4, 21.6], [12.4, 22.4], [12.0, 23.5], [0.0, 23.5]]

# Kerangka kepala: asal = puncak kepala (poll) di belakang telinga, u = sepanjang kepala ke moncong (menunduk 38 deg),
# w = tegak lurus ke arah dahi, y = samping. Panjang kepala 28 mm x skala [A][P].
[[kerangka]]
nama = "kepala"
asal = [-1.0, 55.5]
sudut = 22.0     # rev 6b (banding, tinggi z tak terdistorsi sudut 3/4): referensi mata z~49,7, moncong z~41 -> 32 terlalu menunduk
skala = 0.95     # rev 6b: kepala lebih pendek agar moncong tetap lewat tepi alas ~4,4 mm (riset 3-5 mm)

# ---------------- leher + dada (dunia) ----------------
[[detail]]
