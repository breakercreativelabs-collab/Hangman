# Rancangan bentuk: bidak PION catur gaya Staunton (prompt: "sekarang coba bidak catur pion").
# Skill /modeling-prompt. Satuan mm; Z = tinggi (0 = alas). [F] fakta bersumber, [A] anatomi bidak Staunton
# (pengetahuan umum: alas bubut bertingkat -> badan lonceng menyempit -> kerah piringan -> bola kepala).
# Jenis bentuk = benda bubut murni -> SATU resep `putar` (pelajaran 2: pilih resep sesuai jenis bentuk).
# Tanpa juri banding: unduh gambar referensi web diblokir kebijakan jaringan cloud.

[objek]
nama = "pion catur"
tinggi_mm = 53.0        # [F] pion 2,08" = 53 mm pada set raja 3,75" (chessbazaar Pro Staunton; kuda set yang sama 61 mm)
diameter_alas_mm = 32.0 # [F] alas pion 1,25" = 32 mm (chessbazaar, set sama)
voxel_mm = 0.2
gabung_halus_mm = 0.0
target_segitiga = 80000
sumber = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
  "https://en.wikipedia.org/wiki/Chess_set",
]

# Profil (r, z) dari bawah ke puncak [A]: cincin dasar r16 + alur, manik r15,2, cekung, torus kecil; badan lonceng
# menyempit ke batang r5,2 (z 29); kerah piringan r9 tebal ~1,8 (z 32,4-34,2); leher r4,4; bola R7,3 pusat z45,7.
[[bagian]]
nama = "badan bubut"
resep = "putar"
profil_halus = 0.25     # rev 1: kurva Catmull-Rom; rev 0 ruas lurus -> pita cincin terlihat di bola & badan
profil_tajam = [1, 2, 3, 41]   # rev 1b: sudut dasar & puncak tetap persis (tanpa ini kurva melengkung keluar 0,3 mm)
