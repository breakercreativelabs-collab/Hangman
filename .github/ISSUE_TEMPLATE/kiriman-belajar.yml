name: Feedback (bug or preference)
description: Something looked wrong, or you prefer a different result. Optionally attach the anonymised export.
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't attach client files or images you can't share publicly.
        Optional: run `belajar ekspor --setuju 1` (or ask Claude to "export my feedback") and paste the resulting
        `kiriman.json`. It is stripped of paths, emails, usernames, client file names and tokens before it is written.
  - type: dropdown
    id: jenis
    attributes:
      label: Type
      options: [bug / wrong result, preference, both]
    validations: {required: true}
  - type: input
    id: modul
    attributes:
      label: Module
      placeholder: perakit / product_shot / modeling_referensi / tvc / prosedural
  - type: textarea
    id: ringkasan
    attributes:
      label: What happened
      description: What you asked for, what you got, and what you expected. A few sentences is plenty.
    validations: {required: true}
  - type: textarea
    id: kiriman
    attributes:
      label: kiriman.json (optional)
      render: json
  - type: checkboxes
    id: izin
    attributes:
      label: Permission
      options:
        - label: This feedback may be used to add new checks or presets to the project (GPL-3.0-or-later).
          required: true
