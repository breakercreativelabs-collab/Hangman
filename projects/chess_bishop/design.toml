# Shape design: Staunton-style chess BISHOP (3rd rung of the ladder: turned + 1 cut; /modeling-prompt skill).
# Units mm; Z = height, +X = front (cut direction). [F] sourced fact, [A] common Staunton anatomy, [D] design decision.

[entity]
name = "bishop catur"
height_mm = 71.0        # [F] bishop 2.79" = 71 mm in a set with a 3.75" king (chessbazaar; pawn 53, rook 56 in the same set)
base_diameter_mm = 36.0 # [F] bishop base 1.41" = 36 mm (chessbazaar, same set)
voxel_mm = 0.2
smooth_union_mm = 0.0
target_triangles = 100000
limit_mm = [[-20.0, -20.0, -1.0], [20.0, 20.0, 73.0]]
source = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
]

# Profile (r, z) [A]: stepped base (pawn style, r 18), slim bell body down to a stem r 5.2, double collar (disc
# r 9.8 + ring r 7.7), neck, rounded egg-shaped mitre (max r 7.7 at z 57.4) tapering, small ball on top (r 1.75).
[[part]]
name = "turned body"
recipe = "lathe"
smoothed_profile = 0.25
sharp_profile = [1, 2, 3, 45]
profile = [[0.0, 0.0], [17.3, 0.0], [18.0, 0.7], [18.0, 2.9], [17.2, 3.6], [16.0, 4.2], [16.2, 5.1], [17.1, 6.2],
          [17.1, 7.5], [16.0, 8.6], [14.2, 9.3], [13.8, 10.4], [14.4, 11.5], [14.2, 12.6], [13.0, 13.4],
          [11.6, 14.8], [10.0, 17.0], [8.4, 21.0], [7.0, 26.0], [6.0, 32.0], [5.4, 38.0], [5.2, 41.5],
          [5.6, 42.6], [6.6, 43.4], [9.6, 44.2], [9.8, 45.4], [9.0, 46.2], [6.4, 46.8], [7.6, 47.6], [7.7, 48.6],
          [6.6, 49.2], [5.0, 49.8], [4.6, 51.0], [5.6, 52.2], [6.8, 53.6], [7.5, 55.4], [7.7, 57.4], [7.5, 59.4],
          [6.9, 61.4], [5.9, 63.3], [4.5, 65.0], [2.9, 66.3], [1.6, 67.0], [1.4, 67.6], [1.75, 69.2], [0.0, 71.0]]

# Mitre cut [A][D]: a straight 1.1 mm slot from the front top down to the mitre center, tilted 40 deg (the bishop's hallmark).
[[skeleton]]
name = "mitra"
origin = [0.0, 60.5]
angle = -40.0   # u points to the front top

[[detail]]
name = "mitre cut"
skeleton = "mitra"
kind = "subtract_box"
center = [4.0, 0.0, 0.0]
half_size = [4.6, 10.0, 0.55]
r = 0.2

[qc]
height_tolerance_mm = 0.5
diameter_tolerance_mm = 0.4
symmetry_tolerance_mm = 0.3
max_polygons = 150000
