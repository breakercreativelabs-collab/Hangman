# Shape design: Staunton-style chess PAWN (prompt: "now try a chess pawn").
# /modeling-prompt skill. Units mm; Z = height (0 = base). [F] sourced fact, [A] Staunton piece anatomy
# (common knowledge: stepped turned base -> narrowing bell body -> collar disc -> ball head).
# Shape type = a pure turned object -> ONE `lathe` recipe (lesson 2: pick the recipe that fits the shape type).
# No comparison judge: downloading web reference images is blocked by the cloud network policy.

[entity]
name = "pawn catur"
height_mm = 53.0        # [F] pawn 2.08" = 53 mm in a set with a 3.75" king (chessbazaar Pro Staunton; the knight of the same set is 61 mm)
base_diameter_mm = 32.0 # [F] pawn base 1.25" = 32 mm (chessbazaar, same set)
voxel_mm = 0.2
smooth_union_mm = 0.0
target_triangles = 80000
source = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
  "https://en.wikipedia.org/wiki/Chess_set",
]

# Profile (r, z) from bottom to top [A]: base ring r16 + groove, bead r15.2, cove, small torus; bell body
# narrowing to a stem r5.2 (z 29); collar disc r9 thickness ~1.8 (z 32.4-34.2); neck r4.4; ball R7.3 centered at z45.7.
[[part]]
name = "turned body"
recipe = "lathe"
smoothed_profile = 0.25     # rev 1: Catmull-Rom curve; rev 0 straight segments -> visible ring bands on the ball & body
sharp_profile = [1, 2, 3, 41]   # rev 1b: base & top corners stay exact (without this the curve bulges out 0.3 mm)
profile = [[0.0, 0.0], [15.4, 0.0], [16.0, 0.6], [16.0, 2.6], [15.3, 3.3], [14.2, 3.8], [14.4, 4.6], [15.2, 5.6],
          [15.2, 6.8], [14.2, 7.8], [12.6, 8.4], [12.3, 9.4], [12.8, 10.4], [12.6, 11.4], [11.6, 12.2], [10.4, 13.5],
          [9.0, 15.5], [7.6, 18.5], [6.4, 22.0], [5.6, 26.0], [5.2, 29.0], [5.4, 30.5], [6.2, 31.6], [8.8, 32.4],
          [9.0, 33.4], [8.4, 34.2], [5.6, 35.0], [4.6, 36.4], [4.4, 39.0], [5.74, 41.19], [6.47, 42.33],
          [6.99, 43.59], [7.26, 44.92], [7.28, 46.28], [7.04, 47.62], [6.57, 48.89], [5.86, 50.05], [4.95, 51.06],
          [3.87, 51.89], [2.66, 52.5], [1.35, 52.87], [0.0, 53.0]]

[qc]
height_tolerance_mm = 0.5
diameter_tolerance_mm = 0.4
symmetry_tolerance_mm = 0.3
max_polygons = 150000
