# Shape design: Staunton-style chess QUEEN (4th rung of the ladder: turned + notched crown; /modeling-prompt
# skill). Units mm; Z = height. [F] sourced fact, [A] common Staunton anatomy, [D] design decision.

[entity]
name = "queen catur"
height_mm = 79.0        # [F] queen 3.11" = 79 mm in a set with a 3.75" king (chessbazaar; same set as pawn/rook/bishop)
base_diameter_mm = 43.0 # [F] queen base 1.69" = 43 mm (chessbazaar, same set)
voxel_mm = 0.2
smooth_union_mm = 0.0
target_triangles = 110000
limit_mm = [[-23.0, -23.0, -1.0], [23.0, 23.0, 81.0]]
source = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
]

# Profile (r, z) [A]: stepped base (bishop style, r 21.5), slim bell body down to a stem r 6.1, double collar
# (r 11.4 + 8.9), neck, crown flaring like a cup to a rim r 10.2 (z 74.4), hollow cup inside, ball r 2.6 in the
# middle of the top.
[[part]]
name = "turned body"
recipe = "lathe"
smoothed_profile = 0.25
sharp_profile = [1, 2, 3, 39, 40, 50]
profile = [[0, 0], [20.7, 0], [21.5, 0.8], [21.5, 3.3], [20.5, 4.1], [19.1, 4.8], [19.3, 5.8], [20.3, 7.0], [20.3, 8.4],
          [19.0, 9.6], [16.9, 10.4], [16.4, 11.6], [17.1, 12.8], [16.9, 14.0], [15.5, 14.9], [13.8, 16.4],
          [11.8, 19.0], [9.8, 23.5], [8.2, 29.0], [7.0, 36.0], [6.3, 43.0], [6.1, 48.0], [6.6, 49.2], [7.8, 50.0],
          [11.2, 50.9], [11.4, 52.2], [10.5, 53.1], [7.4, 53.8], [8.8, 54.7], [8.9, 55.8], [7.6, 56.5], [5.9, 57.2],
          [5.4, 58.6], [5.6, 60.5], [6.6, 62.5], [8.0, 65.0], [9.3, 68.0], [10.8, 71.0], [11.4, 73.0], [11.6, 74.4],
          [8.0, 74.4], [7.6, 73.4], [5.2, 72.6], [3.2, 72.4], [2.0, 72.8], [1.6, 73.8], [2.2, 74.9], [2.6, 76.4],
          [2.2, 77.9], [1.3, 78.65], [0.0, 79.0]]

# Crown points [A][D]: 8 V notches (inverted cones) in the cup rim -> 8 sharp crown points; repeated around starting
# at 22.5 deg for symmetry. rev 2: cup wall 1.8 -> 3.6 mm + V notches (rev 0-1: round scallops tore the thin wall,
# reading as "a cracked eggshell").
[[detail]]
name = "crown notch"
kind = "subtract_cone"
a = [11.0, 0.0, 78.0]
b = [11.0, 0.0, 72.0]   # rev 2b: deeper notch (2.4 mm below the rim, ~2.6 mm wide); rev 2 was only a scratch
r1 = 3.0
r2 = 0.2
smoothness = 0.15
spin_n = 8
spin_start = 22.5

[qc]
height_tolerance_mm = 0.5
diameter_tolerance_mm = 0.4
symmetry_tolerance_mm = 0.3
max_polygons = 160000
