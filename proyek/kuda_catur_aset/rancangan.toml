# Rancangan bentuk: KUDA catur lewat JALUR ASET (keputusan pengguna 2026-10-17: organik boleh "cari aset berlisensi
# lalu sesuaikan"). Kepala-leher-badan = aset terbuka berlisensi (dinilai juri KA dulu), dipotong di atas alasnya,
# dipasang pada alas set kita (sama dengan kuda v2) -> satu mesh baru tertutup lewat SDF, lolos QC KC.
# Keindahan bentuk kepala = karya seniman aset (lihat atribusi), bukan dibangun agen. Non-generatif.
# rev 1: subdiv 2 (aset berfaset). rev 2 (mata pengguna: "badan & alas terpisah", "tidak punya mata"): badan diteruskan
# ke kerah + gabung 2,5; mata, lubang hidung, mulut relatif permukaan; KA-08 kelengkapan ciri wajib.

[objek]
nama = "kuda catur (aset)"
tinggi_mm = 61.0        # [F] kuda set raja 3,75" = 61 mm (chessbazaar), alas Ø35
diameter_alas_mm = 35.0
voxel_mm = 0.2
gabung_halus_mm = 2.5     # rev 2: 1,0 -> 2,5 (sambungan badan-kerah melengkung, bukan garis patah)
target_segitiga = 140000
batas_mm = [[-21.0, -19.0, -1.0], [22.0, 19.0, 63.0]]
pratinjau = [[0, 4], [35, 18], [90, 4], [30, 10, 1.8, 0.80], [0, 4, 1.8, 0.80]]   # rev 2: + 2 close-up wajah
sumber = ["https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/ABeautifulGame"]

# Alas set (sama dengan kuda v2 rev 1).
[[bagian]]
nama = "alas"
resep = "putar"
profil_halus = 0.25
profil_tajam = [1, 2, 3, 21]
profil = [[0.0, 0.0], [17.0, 0.0], [17.5, 0.7], [17.5, 2.4], [16.3, 3.2], [14.6, 4.0], [14.4, 4.8], [15.4, 5.8],
          [17.2, 7.0], [17.5, 8.5], [17.4, 9.8], [16.6, 11.0], [14.4, 12.0], [12.4, 13.0], [11.4, 14.0], [11.6, 15.0],
          [13.8, 15.8], [14.9, 16.6], [14.6, 17.6], [12.8, 18.2], [11.0, 18.6], [0.0, 18.6]]

# Aset: kuda "A Beautiful Game" (aset disimpan di klien/, tidak di repo). Diskalakan utuh ke 61 mm, moncong ke +X,
# dipotong z < 16,5 (alas aset dibuang, badan menyatu ke kerah alas kita).
[[bagian]]
nama = "kepala dan badan (aset)"
resep = "aset"
model = "klien/referensi-kuda_catur/abeautifulgame/ABeautifulGame.glb"
objek = "Knight_W1"
lisensi = "CC-BY 4.0"
atribusi = "A Beautiful Game: (c) 2020 ASWF (MaterialX Project, model asli); (c) 2022 Ed Mackey (konversi glTF); KhronosGroup/glTF-Sample-Assets"
putar_z = 90.0
tinggi_mm = 61.0
potong_z = 16.5
halus_potong = 0.4
jenis_objek = "kuda"    # rev 2: KA-08 kelengkapan ciri wajib (mata, telinga, lubang hidung, mulut, surai)
ciri_aset = ["telinga", "surai"]   # diperiksa Claude di close-up: telinga jelas; surai = punggungan halus (lemah)
perpanjang_dari_z = 22.0  # rev 2: bawah badan aset membulat ("kelereng di atas piring") -> penampang z 22 diteruskan ke kerah
subdiv = 2              # rev 1: aset 11 rb segitiga tampak berfaset -> Catmull-Clark 2 level (setelah las vertex)

# ---- rev 2: wajah. Aset tidak punya mata (cacat dari mata pengguna 2026-10-17) dan cuping hidungnya nyaris rata ->
# ditambah DI ATAS aset, relatif permukaan (perakit cari Y sendiri). Posisi dari ukuran siluet kepala hasil rev 1:
# poll x~3 z~61, moncong x~19 z~46, rahang bawah z~42-44; mata [A] ~1/3 dari dahi ke moncong, di atas garis tengah kepala.
[[detail]]
nama = "rongga mata"
jenis = "kurangi_bola"
pusat = [7.5, 0.0, 53.5]
r = 1.6
kedalaman = 0.9
halus = 0.35
cermin = true

[[detail]]
nama = "bola mata"
jenis = "tambah_bola"
pusat = [7.5, 0.0, 53.5]
r = 1.15
tonjol = 0.45
halus = 0.15
cermin = true

[[detail]]
nama = "lubang hidung"
jenis = "kurangi_bola"
pusat = [17.0, 0.0, 46.6]
r = 1.0
kedalaman = 0.8
halus = 0.25
cermin = true

[[detail]]
nama = "garis mulut"
jenis = "kurangi_garis"
titik = [[17.8, 0.0, 44.6], [16.4, 0.0, 44.0], [14.8, 0.0, 44.2]]   # dari ujung moncong ke sudut mulut
r = 0.5
kedalaman = 0.7
halus = 0.2
cermin = true

[qc]
toleransi_tinggi_mm = 0.5
toleransi_diameter_mm = 0.4
toleransi_simetri_mm = 0.3
maks_poligon = 200000
