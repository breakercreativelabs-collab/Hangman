# Rancangan bentuk: bidak GAJAH (bishop) catur gaya Staunton (anak tangga ke-3: bubut + 1 irisan; skill /modeling-prompt).
# Satuan mm; Z = tinggi, +X = depan (arah irisan). [F] fakta bersumber, [A] anatomi Staunton umum, [D] keputusan desain.

[objek]
nama = "gajah catur"
tinggi_mm = 71.0        # [F] gajah 2,79" = 71 mm pada set raja 3,75" (chessbazaar; pion 53, benteng 56 set sama)
diameter_alas_mm = 36.0 # [F] alas gajah 1,41" = 36 mm (chessbazaar, set sama)
voxel_mm = 0.2
gabung_halus_mm = 0.0
target_segitiga = 100000
batas_mm = [[-20.0, -20.0, -1.0], [20.0, 20.0, 73.0]]
sumber = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
]

