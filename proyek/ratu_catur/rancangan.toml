# Rancangan bentuk: bidak RATU (queen) catur gaya Staunton (anak tangga ke-4: bubut + mahkota bergerigi; skill
# /modeling-prompt). Satuan mm; Z = tinggi. [F] fakta bersumber, [A] anatomi Staunton umum, [D] keputusan desain.

[objek]
nama = "ratu catur"
tinggi_mm = 79.0        # [F] ratu 3,11" = 79 mm pada set raja 3,75" (chessbazaar; set sama dengan pion/benteng/gajah)
diameter_alas_mm = 43.0 # [F] alas ratu 1,69" = 43 mm (chessbazaar, set sama)
voxel_mm = 0.2
gabung_halus_mm = 0.0
target_segitiga = 110000
batas_mm = [[-23.0, -23.0, -1.0], [23.0, 23.0, 81.0]]
sumber = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
]

# Profil (r, z) [A]: alas bertingkat (gaya gajah, r 21,5), badan lonceng ramping ke batang r 6,1, kerah ganda
