# Rancangan bentuk: bidak kuda catur (prompt: "buatkan aku 3d model bidak catur kuda").
# Ditulis Claude (otak); dibangun persis oleh modul perakit (tangan). Satuan mm. Sumbu dunia: Z = tinggi (0 = alas),
# X = arah moncong (+X), Y = lebar (simetri cermin di Y = 0). Label: [F] fakta bersumber, [D] dugaan/keputusan desain,
# [P] proporsi ditaksir mata dari foto pembanding pengguna (pengetahuan bentuk, bukan dijiplak/diekstrak),
# [A] anatomi kuda (pengetahuan umum: kepala ~ baji, rahang/jowl lebar ~0,5 panjang kepala, mata di sisi pada titik
# terlebar, batang hidung meruncing ke moncong, cuping hidung mengembang, leher melengkung dengan krista surai).
#
# Riwayat: rev 0 nalar saja -> rev 1 pipi -> rev 2 (foto pengguna; bantal + bidang pahat: wajah tetap "papan")
# -> rev 3 (2026-10-16, keputusan pengguna: fokus modeling, tanpa tekstur): kepala & leher disusun dari primitif
# anatomis (elipsoid, kerucut, tabung meruncing) di kerangka lokal kepala; alas rev 2 dipertahankan.
# -> rev 4: VARIASI TEPI (pengguna: "ada yang tegas/lancip, ada yang empuk"): tepi KERAS = bidang pahat di kerangka
# kepala (batang hidung, sisi moncong, depan hidung, dahi, pipi rahang, bawah rahang) + surai/telinga lebih tajam;
# tepi LUNAK = otot rahang, leher, dada (gabung halus tetap). Tiap bidang diukur KC-07 (luas bidang datar).
# -> rev 5 (dengan skill /modeling-prompt): kepala = satu massa baji + 2 tonjolan lunak (KC-22/23).
# -> rev 6: JURI BANDING (render sudut sama vs referensi riset): telinga daun, bidang pipi diagonal, mulut terbuka
#    panjang, bidang leher, surai halus, mata & dada dikecilkan.

[objek]
nama = "kuda catur"
tinggi_mm = 62.0        # [F] set raja 95 mm: kuda 61 mm (chessbazaar); 66-74 mm pada raja 3,9-4,1" (royalchessmall)
diameter_alas_mm = 35.0 # [F] 35-38 mm (chessbazaar 35; royalchessmall 35-38)
voxel_mm = 0.25
gabung_halus_mm = 1.6
target_segitiga = 120000
batas_mm = [[-20.0, -19.5, -0.5], [26.0, 19.5, 64.0]]
sumber = [
  "foto pembanding pengguna 2026-10-16 (kuda kayu ukir) [P]",
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
  "https://royalchessmall.in/products/4-1-pro-staunton-weighted-wooden-chess-pieces-set-ebonised-wood-4-queens",
  "https://www.officialstaunton.com/blogs/news/why-do-some-chess-knights-look-so-different (kualitas: surai, mata, telinga, hidung)",
]

