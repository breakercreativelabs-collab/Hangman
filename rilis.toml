# Manifest rilis publik (open source, keputusan pengguna 2026-10-17). Dibaca alat/rilis.py.
# Hanya berkas TER-TRACK git yang cocok `sertakan` dan tidak cocok `kecualikan` yang masuk paket; lalu diaudit KR-01..07.
[rilis]
lisensi = "GPL-3.0-or-later"
blender_min = "5.2.0"   # paket Python konektor dibangun untuk Python 3.13 (Blender 5.2 LTS)
tagline = "Blender agent for Claude with numeric QC, non-generative"
# Keputusan pengguna 2026-10-17: repo publik = AGEN SAJA (berkas untuk bekerja). Uji kita, skill/dokumen Claude,
# dokumen arsitektur internal, dan hasil proyek tidak ikut.
sertakan = [
  "README.md", "blender_cli.py", "konektor_mcp.py", "identitas.toml", "LICENSE", "rilis.toml",
  "src/", "addon/", "proyek/", "alat/rilis.py",
  "docs/KONEKTOR.md", "docs/TONTON.md", "docs/BELAJAR.md", "docs/gambar/",
  ".github/ISSUE_TEMPLATE/", ".github/workflows/rilis.yml",
]
kecualikan = [
  "proyek/am1/", "proyek/am90/",   # proyek latihan bermerek (spec, tidak berafiliasi): tidak disebar
  "proyek/*/hasil/",                # keluaran uji/contoh kita (dibuat ulang saat dipakai)
  "docs/README_PUBLIK.md",          # jadi README.md paket (nama produk diisi dari identitas.toml)
]
# Tidak boleh ada di paket sama sekali (ruang ide pribadi, klien, biner, pengaturan lokal).
terlarang = ["00-inbox/", "01-ide/", "02-arsip/", "sesi/", "eksperimen/", "klien/", "artefak/", "CLAUDE.md",
             "INDEX.md", ".claude/worktrees/", ".claude/settings.local.json", ".env"]
# Merek pihak ketiga yang tidak boleh muncul di paket (cek huruf kecil).
merek = ["nike", "air max", "adidas"]
