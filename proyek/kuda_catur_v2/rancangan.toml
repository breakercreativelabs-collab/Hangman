# Rancangan bentuk: KUDA catur gaya Staunton, BARU (v2, 2026-10-17; v1 = proyek/kuda_catur, diparkir).
# Skill /modeling-prompt + pelajaran 1-14: satu set dengan pion/benteng/gajah/ratu/raja; kepala-leher SATU massa
# (siluet samping, penampang membulat penuh, bukan "papan"); detail minim, maks 2 operasi per area; pratinjau 3 tampak.
# Satuan mm; Z = tinggi, +X = arah moncong, simetri cermin Y. [F] fakta bersumber, [A] anatomi/Staunton umum, [D] desain.

[objek]
nama = "kuda catur v2"
tinggi_mm = 61.0        # [F] kuda 2,40" = 61 mm pada set raja 3,75" (chessbazaar; set sama dengan bidak lain)
diameter_alas_mm = 35.0 # [F] alas kuda 1,37" = 35 mm (chessbazaar, set sama)
voxel_mm = 0.2
gabung_halus_mm = 1.2
target_segitiga = 120000
batas_mm = [[-21.0, -19.0, -1.0], [22.0, 19.0, 63.0]]
pratinjau = [[0, 4], [35, 18], [90, 4]]
sumber = [
  "https://chessbazaar.com/products/the-professional-staunton-series-chess-pieces-in-black-dyed-natural-white-solid-plastic-3-75-king",
]

# Alas [P3D]: rendah (~30% tinggi) seperti referensi 3D: cincin dasar, alur, SATU gelang bulat besar, leher alas,
# piringan kerah tipis. (rev 1; rev 0 bertumpuk seperti per). r diskalakan ke Ø35 (fakta set).
[[bagian]]
nama = "alas"
resep = "putar"
profil_halus = 0.25
profil_tajam = [1, 2, 3, 21]
profil = [[0.0, 0.0], [17.0, 0.0], [17.5, 0.7], [17.5, 2.4], [16.3, 3.2], [14.6, 4.0], [14.4, 4.8], [15.4, 5.8],
          [17.2, 7.0], [17.5, 8.5], [17.4, 9.8], [16.6, 11.0], [14.4, 12.0], [12.4, 13.0], [11.4, 14.0], [11.6, 15.0],
          [13.8, 15.8], [14.9, 16.6], [14.6, 17.6], [12.8, 18.2], [11.0, 18.6], [0.0, 18.6]]

# Kepala + leher [P3D]: SATU massa siluet. rev 1 dari proporsi referensi 3D (diukur, bukan disalin): kepala tinggi &
# mendatar (moncong z ~45, rev 0: 37), punggung leher melengkung jauh ke belakang (x -18 di z 28-36), cekung tenggorokan
# dalam di bawah rahang (z 37), rahang bawah z ~39,5, dada maju (x 10), tubuh ramping (setengah tebal 6-8 mm).
[[bagian]]
nama = "kepala dan leher"
resep = "bantal"
siluet = [
  [-10.5, 14.0], [-14.0, 17.0], [-15.6, 20.0], [-16.6, 23.0], [-17.6, 27.0], [-18.2, 31.0], [-18.2, 35.0],
  [-17.4, 39.0], [-15.6, 43.5], [-13.4, 47.5], [-11.0, 51.5], [-8.2, 54.8], [-5.0, 57.6], [-1.5, 58.8],
  [1.5, 59.2],                                                                                      # punggung -> poll
  [5.0, 58.4], [9.0, 55.8], [13.0, 52.2], [16.2, 48.6], [18.0, 46.4], [18.6, 44.6],                 # dahi -> hidung
  [18.0, 42.8], [16.6, 42.0], [13.6, 42.2], [16.0, 41.0], [15.2, 39.8],                             # mulut, dagu
  [12.0, 39.4], [8.0, 39.6], [4.6, 39.2], [3.0, 37.0], [3.6, 34.0],                                 # rahang -> tenggorok
  [5.2, 31.0], [7.6, 27.5], [9.6, 24.0], [10.4, 20.0], [10.0, 16.5], [9.0, 14.0],                   # leher depan -> dada
]
tebal_z = [[14.0, 8.4], [20.0, 8.0], [28.0, 8.3], [34.0, 7.0], [38.0, 6.5], [44.0, 6.1], [52.0, 6.1], [56.0, 5.3],
           [61.0, 4.3]]
runcing_x0 = 10.0
runcing_laju = 0.15
tebal_x = [[-19.0, 0.55], [-13.0, 0.85], [-7.0, 1.0], [19.0, 1.0]]   # rev 2: punggung menyempit (punggungan surai)
bulat_mm = 7.0          # rev 2: 4 -> 7 = penampang oval (rev 1 datar seperti tiang dari depan)


# ---- Wajah rev 3: detail diberi KEDALAMAN/TONJOL relatif permukaan (perakit mencari permukaan sendiri); rev 2 posisi
# Y ditebak -> mata/hidung/mulut melayang di luar kepala (tak terlihat). Ukuran diperbesar agar terbaca di 61 mm. ----
# Telinga [A]: dua, tegak, berbentuk daun, cekung ke depan; poll diturunkan 1,4 mm agar telinga ~2,5 mm di atas kepala.
[[detail]]
nama = "telinga"
jenis = "tambah_kerucut"
a = [0.2, 2.3, 57.4]
b = [-0.8, 2.8, 60.6]
r1 = 2.0
r2 = 0.55
skala = [0.65, 1.0, 1.0]
halus = 0.5
cermin = true

[[detail]]
nama = "cekung telinga"
jenis = "kurangi_kerucut"
a = [0.9, 2.3, 58.2]
b = [-0.2, 2.7, 60.3]
r1 = 0.9
r2 = 0.2
skala = [0.6, 1.0, 1.0]
halus = 0.2
cermin = true

[[detail]]
nama = "rongga mata"
jenis = "kurangi_bola"
pusat = [6.5, 0.0, 52.5]
r = 1.6
kedalaman = 1.0
halus = 0.3
cermin = true

[[detail]]
nama = "bola mata"
jenis = "tambah_bola"
pusat = [6.5, 0.0, 52.5]
r = 1.1
tonjol = 0.5
halus = 0.15
cermin = true

[[detail]]
nama = "cuping hidung"
jenis = "tambah_bola"
pusat = [16.2, 0.0, 44.8]
r = 1.6
tonjol = 0.6
halus = 0.6
cermin = true

[[detail]]
nama = "lubang hidung"
jenis = "kurangi_bola"
pusat = [16.6, 0.0, 44.8]
r = 1.1
kedalaman = 0.9
halus = 0.25
cermin = true

[[detail]]
nama = "garis mulut"
jenis = "kurangi_garis"
titik = [[15.8, 0.0, 42.7], [13.6, 0.0, 42.5], [11.6, 0.0, 42.8]]   # sambung dari sudut mulut ke belakang
r = 0.55
kedalaman = 0.8
halus = 0.2
cermin = true

# Surai: punggungan sempit di tengah punggung leher dengan alur di kedua sisi (referensi 3D).
[[detail]]
nama = "alur surai"
jenis = "kurangi_garis"
titik = [[-12.6, 6.0, 21.0], [-15.2, 6.0, 31.0], [-14.6, 5.8, 38.0], [-12.6, 5.6, 44.0], [-9.8, 5.4, 50.0],
         [-6.4, 4.8, 55.0]]   # rev 1: punggungan surai sempit di tengah (referensi), alur di kedua sisi
r = 0.7
halus = 0.2
cermin = true


# Juri banding 3D: referensi riset = kuda "A Beautiful Game" (set catur sampel glTF Khronos; (c) 2020 ASWF/MaterialX,
# konversi glTF (c) 2022 Ed Mackey; CC-BY 4.0). Disimpan di klien/ (tidak masuk repo); dirender clay dari sudut yang
# sama dengan model untuk MENILAI, bukan disalin. Sumber: github.com/KhronosGroup/glTF-Sample-Assets/Models/ABeautifulGame
[referensi_3d]
model = "klien/referensi-kuda_catur/abeautifulgame/ABeautifulGame.glb"
objek = "Knight_W1"
putar_z = 90.0
tampak = [[0, 4], [35, 18], [90, 4], [180, 4], [-90, 4], [0, 89], [30, 10, 2.2, 0.76], [90, 6, 2.2, 0.76]]

[qc]
toleransi_tinggi_mm = 0.5
toleransi_diameter_mm = 0.4
toleransi_simetri_mm = 0.3
maks_poligon = 170000
