# Shape design: Staunton-style chess KING (5th rung of the ladder: turned + cross; /modeling-prompt skill).
# Units mm; Z = height. [F] sourced fact, [A] common Staunton anatomy, [D] design decision.
# Body = the queen profile (scaled r 22.5/21.5, z 1.04) up to the crown rim, then a closed dome + bead; cross from 2 boxes.

[entity]
