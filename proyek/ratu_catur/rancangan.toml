# Gerigi mahkota [A][D]: 8 takik V (kerucut terbalik) di tepi cawan -> 8 ujung mahkota tajam; diulang melingkar mulai
# 22,5 deg agar simetris. rev 2: dinding cawan 1,8 -> 3,6 mm + takik V (rev 0-1: lekuk bulat merobek dinding tipis,
# terbaca "kulit telur pecah").
[[detail]]
nama = "takik mahkota"
jenis = "kurangi_kerucut"
a = [11.0, 0.0, 78.0]
b = [11.0, 0.0, 72.0]   # rev 2b: takik lebih dalam (2,4 mm di bawah tepi, lebar ~2,6 mm); rev 2 hanya goresan
r1 = 3.0
r2 = 0.2
halus = 0.15
putar_n = 8
putar_awal = 22.5

[qc]
toleransi_tinggi_mm = 0.5
toleransi_diameter_mm = 0.4
toleransi_simetri_mm = 0.3
maks_poligon = 160000
