# Rilis otomatis (repo publik): versi di identitas.toml berubah di main (atau dijalankan manual) -> audit privasi +
# ekstensi Blender per OS -> GitHub Release "v<versi>" (tag dibuat oleh action; tidak perlu push tag).
name: rilis
on:
  push:
    branches: [main]
    paths: [identitas.toml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Versi
        id: versi
        run: echo "v=$(python -c "import tomllib;print(tomllib.load(open('identitas.toml','rb'))['versi'])")" >> "$GITHUB_OUTPUT"
      - name: Audit + paket (sumber + ekstensi windows/macos/linux)
        run: python alat/rilis.py
      - name: Release v${{ steps.versi.outputs.v }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versi.outputs.v }}
          name: v${{ steps.versi.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            artefak/rilis/*.zip
